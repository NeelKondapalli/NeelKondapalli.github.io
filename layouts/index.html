{{ define "main" }}
<div class="home">
    {{ .Content }}
</div>
{{ end }}

{{ define "scripts" }}
<script>
    const fonts = [
        'Geist Pixel',
        'Geist Pixel Circle',
        'Geist Pixel Grid',
        'Geist Pixel Line',
        'Geist Pixel Triangle'
    ];

    let fontIndex = 0;

    // Find the h2 element containing "Hi, I'm Neel!"
    const heading = document.querySelector('.home h2');

    if (heading) {
        const interval = setInterval(() => {
            fontIndex = (fontIndex + 1) % fonts.length;
            heading.style.fontFamily = fonts[fontIndex];
        }, 350);
    }
</script>
{{ end }}
